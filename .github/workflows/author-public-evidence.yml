name: Author public-event and version evidence (read-only)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/probe-author-public-evidence.mjs
      - tests/probe-author-public-evidence.test.mjs
      - .github/workflows/author-public-evidence.yml

permissions:
  contents: read

jobs:
  author-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Test identity, source limits and no automatic timestamp promotion
        run: node --test tests/probe-author-public-evidence.test.mjs
      - name: Inspect one fixed public-event hour and two exact DOI records
        run: node scripts/probe-author-public-evidence.mjs
      - name: Preserve source evidence and explicit failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: author-public-evidence
          path: evidence/author-public-evidence.json
          retention-days: 30
          if-no-files-found: warn
