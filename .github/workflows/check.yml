# Checks on GitHub-hosted runners.
#
# Pure canonical-content changes (only portable/content/selected.jsonl) use a fast path:
# deterministic content validation + static build/smoke, while preserving the existing
# "check" and "docker" job names for status-check compatibility.
#
# Any other change runs the full native CI: install, typecheck, web build/tests,
# PostgreSQL-backed backend tests, runtime smoke, and Docker Compose smoke.
# Only GitHub-owned actions, pinned to a full commit SHA.
name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: aihot_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:ci@127.0.0.1:5432/aihot_ci
      SITE_URL: http://127.0.0.1:3000
      API_BASE_URL: http://127.0.0.1:3001
      SESSION_SECRET: ci-session-secret-0123456789abcdef
      IMG_PROXY_SIGN_SECRET: ci-img-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Classify changed files
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          else
            echo "content_only=false" >> "$GITHUB_OUTPUT"
            echo "workflow_dispatch: full CI"
            exit 0
          fi

          mapfile -t changed < <(git diff --name-only "$base" "$head")
          printf 'changed: %s\n' "${changed[@]:-<none>}"

          content_only=false
          if (( ${#changed[@]} > 0 )); then
            content_only=true
            for path in "${changed[@]}"; do
              if [[ "$path" != "portable/content/selected.jsonl" ]]; then
                content_only=false
                break
              fi
            done
          fi

          echo "content_only=$content_only" >> "$GITHUB_OUTPUT"
          echo "content_only=$content_only"

      - name: Install
        if: steps.changes.outputs.content_only != 'true'
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        if: steps.changes.outputs.content_only != 'true'
        run: npm run typecheck
      - name: Build web
        if: steps.changes.outputs.content_only != 'true'
        run: npm run build -w @aihot/web

      - name: Check selected content integrity
        run: npm run content:check
      - name: Build static-chatgpt site
        env:
          STATIC_BASE_URL: https://charlie-wang-03.github.io/ai4math-radar/
        run: |
          npm run build:static
          test -f static-dist/index.html
          test -f static-dist/data/selected.json
          grep -q "AI4Math Radar" static-dist/index.html
          grep -q 'class="sidebar"' static-dist/index.html
          test -f static-dist/assets/aihot.css
          test -f static-dist/assets/aihot.js

      - name: Web tests
        if: steps.changes.outputs.content_only != 'true'
        run: node --test apps/web/tests/*.test.ts

      - name: Migrate and seed topics
        if: steps.changes.outputs.content_only != 'true'
        run: |
          node scripts/migrate.ts
          node scripts/seed.ts --topics-only
      - name: Smoke check of the built site
        if: steps.changes.outputs.content_only != 'true'
        # The site itself runs with collection and model calls off (the tests below use local stubs).
        env:
          COLLECT_ENABLED: "false"
          MODEL_CALLS_ENABLED: "false"
        run: |
          node apps/api/src/main.ts > "$RUNNER_TEMP/api.log" 2>&1 &
          (cd apps/web && NODE_ENV=production exec node server.ts) > "$RUNNER_TEMP/web.log" 2>&1 &
          for i in $(seq 1 60); do curl -fsS -o /dev/null http://127.0.0.1:3000/api/health 2>/dev/null && break; sleep 1; done
          node scripts/smoke.ts --base http://127.0.0.1:3000
      # After the smoke check, which reads an empty database: these write their own rows.
      - name: Backend tests
        if: steps.changes.outputs.content_only != 'true'
        run: npm test
      - name: Server logs
        if: failure() && steps.changes.outputs.content_only != 'true'
        run: tail -n 60 "$RUNNER_TEMP/api.log" "$RUNNER_TEMP/web.log" 2>/dev/null || true

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          else
            echo "content_only=false" >> "$GITHUB_OUTPUT"
            echo "workflow_dispatch: full CI"
            exit 0
          fi

          mapfile -t changed < <(git diff --name-only "$base" "$head")
          printf 'changed: %s\n' "${changed[@]:-<none>}"

          content_only=false
          if (( ${#changed[@]} > 0 )); then
            content_only=true
            for path in "${changed[@]}"; do
              if [[ "$path" != "portable/content/selected.jsonl" ]]; then
                content_only=false
                break
              fi
            done
          fi

          echo "content_only=$content_only" >> "$GITHUB_OUTPUT"
          echo "content_only=$content_only"

      - name: Content-only fast path
        if: steps.changes.outputs.content_only == 'true'
        run: echo "Docker/native runtime checks are not relevant to a canonical-content-only change."

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.changes.outputs.content_only != 'true'
        with:
          node-version: 24
          package-manager-cache: false
      - name: Configure a throwaway site
        if: steps.changes.outputs.content_only != 'true'
        run: |
          node scripts/init-env.ts --llm-key ci-not-a-real-key
          # No outside calls in CI: nothing is collected and no model is asked.
          sed -i 's/^COLLECT_ENABLED=.*/COLLECT_ENABLED=false/; s/^MODEL_CALLS_ENABLED=.*/MODEL_CALLS_ENABLED=false/' .env
          # The smoke check reaches the site by its compose service name.
          echo "MCP_ALLOWED_HOSTS=web" >> .env
      - name: Build and start with docker compose
        if: steps.changes.outputs.content_only != 'true'
        run: docker compose up -d --build
      - name: Smoke check
        if: steps.changes.outputs.content_only != 'true'
        run: |
          for i in $(seq 1 90); do curl -fsS -o /dev/null http://127.0.0.1:3000/api/health 2>/dev/null && break; sleep 2; done
          docker compose ps
          docker compose run --rm --no-deps --entrypoint node setup scripts/smoke.ts --base http://web:3000
          docker compose exec -T db psql -U aihot -d aihot -Atc "select count(*) from sources" | grep -q '^9$'
      - name: Logs
        if: failure() && steps.changes.outputs.content_only != 'true'
        run: docker compose logs --tail 80
      - name: Stop
        if: always() && steps.changes.outputs.content_only != 'true'
        run: docker compose down -v
