name: Batch41 fixed source evidence
on:
  push:
    branches: [audit/arxiv-clocked-batch41]
    paths: [.github/workflows/batch41-evidence.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read fixed immutable public snapshots only
        shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures, datetime, hashlib, json, pathlib, re, urllib.request, urllib.error, xml.etree.ElementTree as ET
          out=pathlib.Path('evidence');out.mkdir()
          ids={'2610.15483','2610.12234','2610.08319','2610.05701','2610.05367','2610.05322','2610.01799','2610.00885'}
          original='e597e5120c034115fda2049d72812f2da7f99f3a'
          rendered='9e971e4a9ec325fec5eadf178c36e2afe223b0b2'
          specs=[]
          windows={'math.NT':['08','09','11','12','13'],'cs.AI':['05','06','07','08'],'cs.LO':['04','05','06'],'cs.LG':['01','02','03','05','06','07'],'cs.SE':['01','02','03']}
          for category,days in windows.items():
              for day in days:
                  path=f'rss_data/{category}/2026-10-{day}_{category}.xml'
                  specs.append(('xml',category,f'https://raw.githubusercontent.com/ehijano/rss_fetch/{original}/{path}',f'https://github.com/ehijano/rss_fetch/blob/{original}/{path}'))
          for category,slug,days in [('cs.AI','arxiv-cs-ai',['02','05','06','07','08']),('cs.LG','arxiv-cs-lg',['02','05','06','07','08'])]:
              for day in days:
                  path=f'feed-entries/2026-10-{day}/{slug}.md'
                  specs.append(('rendered',category,f'https://raw.githubusercontent.com/sifted-network/sifted-awesome-ai-agents/{rendered}/{path}',f'https://github.com/sifted-network/sifted-awesome-ai-agents/blob/{rendered}/{path}'))
          assert len(specs)==31
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*a,**k):return None
          def read(spec):
              kind,category,url,source=spec
              r={'kind':kind,'category':category,'url':url,'sourceUrl':source,'matches':[]}
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'AI4Math-Radar-finite-source-audit'})
                  with urllib.request.build_opener(NoRedirect).open(req,timeout=15) as response:
                      data=response.read(8*1024*1024+1);r['httpStatus']=response.status
                  if len(data)>8*1024*1024:raise ValueError('fixed 8 MiB response cap exceeded')
                  text=data.decode('utf-8',errors='strict')
                  filename=hashlib.sha256(url.encode()).hexdigest()[:16]+('.xml' if kind=='xml' else '.md')
                  (out/filename).write_bytes(data)
                  r.update(bytes=len(data),sha256=hashlib.sha256(data).hexdigest(),file=filename)
                  if kind=='xml':
                      root=ET.fromstring(text);ch=root.find('channel')
                      if root.tag!='rss' or ch is None:raise ValueError('not RSS channel')
                      r['channelTitle']=ch.findtext('title');r['channelLink']=ch.findtext('link');r['channelPubDate']=ch.findtext('pubDate')
                      if r['channelLink'] not in [f'http://rss.arxiv.org/rss/{category}',f'https://rss.arxiv.org/rss/{category}']:raise ValueError('channel/category mismatch')
                      r['itemCount']=len(ch.findall('item'))
                      for it in ch.findall('item'):
                          link=(it.findtext('link') or '').strip()
                          m=re.fullmatch(r'https?://arxiv.org/abs/(\d{4}\.\d{4,5})(v\d+)?',link)
                          if not m or m[1] not in ids:continue
                          r['matches'].append({'arxivId':m[1],'title':it.findtext('title'),'link':link,'guid':it.findtext('guid'),'pubDate':it.findtext('pubDate'),'announceType':it.findtext('{http://arxiv.org/schemas/atom}announce_type'),'descriptionPrefix':(it.findtext('description') or '')[:110],'categories':[x.text for x in it.findall('category')]})
                  else:
                      for block in re.split(r'(?m)^## ',text):
                          hits=[i for i in sorted(ids) if re.search(r'arXiv:'+re.escape(i)+r'v\d+',block)]
                          for i in hits:
                              r['matches'].append({'arxivId':i,'block':block.strip()})
                  r['complete']=True
              except urllib.error.HTTPError as e:r.update(httpStatus=e.code,complete=False,error='HTTP error')
              except Exception as e:r.update(complete=False,error=str(e)[:220])
              return r
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:results=list(pool.map(read,specs))
          report={'checkedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'kind':'BOUNDED_ARCHIVED_PUBLISHER_FIELDS_RESEARCH_ONLY','targets':sorted(ids),'results':results,'guarantee':'No source date is automatically promoted; submission/capture/channel/filename/rendered-local times are not public-release clocks.'}
          (out/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print('BATCH41_SOURCES='+json.dumps({'sources':len(results),'complete':sum(x.get('complete',False) for x in results),'bytes':sum(x.get('bytes',0) for x in results),'matchingObservations':sum(len(x['matches']) for x in results)}))
          for r in results:
              if r['matches']:print('BATCH41_MATCH='+json.dumps({k:v for k,v in r.items() if k!='file'},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: batch41-source-evidence
          path: evidence/
          retention-days: 30
