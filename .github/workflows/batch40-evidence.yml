name: Batch40 fixed arXiv source inspection
on:
  push:
    branches: [audit/arxiv-clocked-batch40]
    paths: [.github/workflows/batch40-evidence.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fcea9ce8f277d0caf5f79733d842408740dcd781
          persist-credentials: false
      - name: Freeze inventory and inspect fifteen immutable original-feed copies
        run: |
          python3 - <<'PY'
          import json,re,hashlib,datetime,time
          import xml.etree.ElementTree as ET
          from pathlib import Path
          from urllib.request import Request,build_opener,HTTPRedirectHandler
          from urllib.parse import urlparse
          from email.utils import parsedate_to_datetime
          BASE='fcea9ce8f277d0caf5f79733d842408740dcd781'
          PIN='e597e5120c034115fda2049d72812f2da7f99f3a'
          targets={'2610.22339':'cs.LG','2610.21881':'cs.LG','2610.20681':'cs.AI','2610.19864':'cs.AI','2610.19470':'math.CO','2610.19223':'cs.AI','2610.18301':'cs.AI','2610.17331':'cs.AI'}
          raw=Path('portable/content/selected.jsonl').read_bytes()
          blob=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          assert blob=='dde56d03c262a590a63fbffe9b7ccfaafeb9462d'
          items=[json.loads(x) for x in raw.splitlines() if x.strip()]
          arxiv=[x for x in items if urlparse(x['links']['original']).hostname in {'arxiv.org','www.arxiv.org','export.arxiv.org'}]
          clocked=[x for x in arxiv if x.get('publishedAt') and not re.search(r'T00:00:00(?:\.000)?Z$',x['publishedAt'])]
          candidates=sorted([x for x in clocked if not x.get('chronology')],key=lambda x:x['publishedAt'],reverse=True)
          assert (len(items),len(arxiv),len(clocked),len(candidates))==(334,120,99,98)
          assert {x['links']['original'].split('/')[-1] for x in candidates[:8]}==set(targets)
          out=Path('evidence');out.mkdir()
          inventory={'baseCommit':BASE,'catalogBlob':blob,'catalogSha256':hashlib.sha256(raw).hexdigest(),'counts':{'records':334,'arxiv':120,'clocked':99,'candidates':98},'candidates':[{'id':x['id'],'publishedAt':x['publishedAt'],'sourceUrl':x['links']['original'],'originalTitle':x['originalTitle']} for x in candidates]}
          (out/'inventory.json').write_text(json.dumps(inventory,ensure_ascii=False,indent=2)+'\n')
          class NoRedirect(HTTPRedirectHandler):
            def redirect_request(self,*args,**kwargs):return None
          opener=build_opener(NoRedirect())
          sources=[];matches=[]
          ns={'a':'http://arxiv.org/schemas/atom'}
          for cat in ['cs.LG','cs.AI','math.CO']:
            for day in range(12,17):
              path=f'rss_data/{cat}/2026-10-{day:02d}_{cat}.xml'
              url=f'https://raw.githubusercontent.com/ehijano/rss_fetch/{PIN}/{path}'
              rec={'category':cat,'path':path,'url':url,'archiveCommit':PIN,'matches':[]}
              try:
                start=time.monotonic();chunks=[];size=0
                with opener.open(Request(url,headers={'User-Agent':'AI4Math-Radar-chronology-audit','Accept':'application/xml'}),timeout=18) as r:
                  rec['status']=r.status
                  while True:
                    b=r.read(65536)
                    if not b:break
                    size+=len(b)
                    if size>12*1024*1024 or time.monotonic()-start>25:raise ValueError('fixed source bounds exceeded')
                    chunks.append(b)
                data=b''.join(chunks);rec['bytes']=size;rec['sha256']=hashlib.sha256(data).hexdigest()
                rec['gitBlob']=hashlib.sha1(b'blob '+str(size).encode()+b'\0'+data).hexdigest()
                assert b'<!DOCTYPE' not in data and b'<!ENTITY' not in data
                root=ET.fromstring(data);assert root.tag=='rss' and root.get('version')=='2.0'
                channel=root.find('channel');assert channel is not None
                assert channel.findtext('title')==cat+' updates on arXiv.org'
                assert channel.findtext('link') in ['http://rss.arxiv.org/rss/'+cat,'https://rss.arxiv.org/rss/'+cat]
                rec['channelPubDate']=channel.findtext('pubDate');rec['itemCount']=len(channel.findall('item'))
                (out/(cat+'-'+str(day)+'.xml')).write_bytes(data)
                for item in channel.findall('item'):
                  link=item.findtext('link','').strip();u=urlparse(link)
                  m=re.fullmatch(r'/abs/(\d{4}\.\d{4,5})(v\d+)?',u.path)
                  if u.scheme!='https' or u.netloc!='arxiv.org' or u.query or u.fragment or not m or m[1] not in targets:continue
                  aid=m[1];desc=item.findtext('description','');identity=re.match(r'arXiv:(\d{4}\.\d{4,5}v\d+)\s+Announce Type:\s*(\S+)',desc)
                  date=item.findtext('pubDate');parsed=parsedate_to_datetime(date) if date else None
                  assert parsed and parsed.tzinfo is not None
                  stamp=parsed.astimezone(datetime.timezone.utc).date().isoformat()
                  entry={'arxivId':aid,'title':item.findtext('title'),'link':link,'guid':item.findtext('guid'),'announceType':item.findtext('a:announce_type',namespaces=ns),'descriptionVersion':identity[1] if identity else None,'descriptionType':identity[2] if identity else None,'sourcePubDate':date,'utcDate':stamp,'categories':[x.text for x in item.findall('category')],'sourceCategory':cat,'archivePath':path,'sourceSha256':rec['sha256'],'originalItemXml':ET.tostring(item,encoding='unicode')}
                  entry['candidateOnly']=bool(identity and identity[1]==aid+'v1' and identity[2]=='new' and entry['announceType']=='new' and entry['guid']=='oai:arXiv.org:'+aid+'v1' and cat==targets[aid] and '2026-10-13'<=stamp<='2026-10-20')
                  matches.append(entry);rec['matches'].append(aid)
              except Exception as e:rec['error']=type(e).__name__+': '+str(e)[:250]
              sources.append(rec)
              print('SOURCE='+json.dumps({k:v for k,v in rec.items() if k!='url'}))
          report={'checkedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'kind':'ORIGINAL_FEED_COPY_CANDIDATES_ONLY_NO_CANONICAL_WRITES','baseline':BASE,'sources':sources,'matches':matches}
          (out/'source-report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          for aid in targets:
            print('TARGET='+json.dumps({'id':aid,'matches':[{k:v for k,v in m.items() if k!='originalItemXml'} for m in matches if m['arxivId']==aid]}))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: batch40-source-evidence
          path: evidence/
          retention-days: 30
          if-no-files-found: error
