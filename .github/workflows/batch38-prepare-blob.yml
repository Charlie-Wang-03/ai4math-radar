name: Batch38 one-off CheckMate blob preparation

on:
  push:
    branches: [data/checkmate-public-project-milestone-batch38]
    paths: [.github/workflows/batch38-prepare-blob.yml]

permissions: {}

jobs:
  prepare-blob:
    if: github.repository == 'Charlie-Wang-03/ai4math-radar' && github.ref == 'refs/heads/data/checkmate-public-project-milestone-batch38'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      # No checkout, repository code execution, ref writes, or main-branch edits.
      # This temporary helper is removed before the content PR is opened.
      - name: Validate baseline and store one unattached Git blob
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          const repo='Charlie-Wang-03/ai4math-radar';
          const branch='data/checkmate-public-project-milestone-batch38';
          const base='e0a56685492848e41e2cd15980b20f75dda53e04';
          const expected='cfcffb42c912271a5b5c6dbb1d75799cf925a29a';
          const path='portable/content/selected.jsonl';
          const id='2023-06-02-checkmate';
          assert.equal(process.env.GITHUB_REPOSITORY,repo);
          assert.equal(process.env.GITHUB_REF,'refs/heads/'+branch);
          assert.equal(process.env.GITHUB_EVENT_NAME,'push');
          const allowedGet='/repos/'+repo+'/contents/'+path+'?ref='+base;
          const allowedPost='/repos/'+repo+'/git/blobs';
          async function api(endpoint,method='GET',body){
            assert.ok((method==='GET'&&endpoint===allowedGet)||(method==='POST'&&endpoint===allowedPost));
            const res=await fetch('https://api.github.com'+endpoint,{method,redirect:'error',
              signal:AbortSignal.timeout(20000),headers:{Authorization:'Bearer '+process.env.GH_TOKEN,
              Accept:'application/vnd.github+json','Content-Type':'application/json'},
              body:body?JSON.stringify(body):undefined});
            if(!res.ok)throw Error('GitHub API HTTP '+res.status);
            return res.json();
          }
          const src=await api(allowedGet);
          assert.equal(src.sha,expected);assert.equal(src.encoding,'base64');
          const original=Buffer.from(src.content,'base64');
          assert.ok(original.length<1000000);
          const gitSha=b=>createHash('sha1').update('blob '+b.length+'\0').update(b).digest('hex');
          assert.equal(gitSha(original),expected);
          const text=new TextDecoder('utf-8',{fatal:true}).decode(original);
          const lines=text.split('\n');
          const entries=lines.filter(x=>x.trim()).map(JSON.parse);
          assert.equal(entries.length,334);assert.equal(new Set(entries.map(x=>x.id)).size,334);
          const matches=lines.map((line,index)=>({line,index})).filter(x=>x.line.trim()&&JSON.parse(x.line).id===id);
          assert.equal(matches.length,1);
          const {line,index}=matches[0],before=JSON.parse(line);
          assert.equal(before.publishedAt,'2023-06-02T00:00:00.000Z');
          assert.equal(before.links.original,'https://arxiv.org/abs/2306.01694');
          assert.match(before.title,/CheckMate/);assert.equal(before.chronology,undefined);
          const note='\n\n时间核验：本条补记的 2023 年 6 月 5 日 UTC 里程碑是作者参与的公开源码协作，不是新研究成果或平台首次上线。作者仓库 PR #1 及同时期 GitHub 公开事件归档确认该日项目已公开；这不等于已核实的 arXiv 首次公告。条目 ID 和兼容字段保留 2023 年 6 月 2 日的历史值，首次 arXiv 公告时间仍待核。';
          const after={...before,summary:before.summary+note,chronology:{eventKind:'other',milestone:{
            date:'2023-06-05',precision:'day',evidenceKind:'original-research-page',
            evidenceUrl:'https://github.com/collinskatie/checkmate/pull/1'}}};
          lines[index]=JSON.stringify(after);
          const updated=Buffer.from(lines.join('\n'),'utf8');
          const changed=Object.keys(after).filter(k=>JSON.stringify(before[k])!==JSON.stringify(after[k])).sort();
          assert.deepEqual(changed,['chronology','summary']);
          const oldLines=text.split('\n');
          assert.equal(lines.filter((x,i)=>x!==oldLines[i]).length,1);
          const result=lines.filter(x=>x.trim()).map(JSON.parse);
          assert.equal(result.length,334);
          const gaps=a=>a.filter(x=>/T00:00:00(?:\.000)?Z$/.test(x.publishedAt||'')&&!x.chronology).map(x=>x.id);
          assert.equal(gaps(entries).length,3);assert.equal(gaps(result).length,2);
          const blob=await api(allowedPost,'POST',{content:updated.toString('base64'),encoding:'base64'});
          assert.equal(blob.sha,gitSha(updated));
          console.log('BATCH38_BEFORE='+JSON.stringify(before));
          console.log('BATCH38_AFTER='+JSON.stringify(after));
          console.log('BATCH38_BLOB='+JSON.stringify({base,path,oldBlob:expected,newBlob:blob.sha,
            bytes:updated.length,sha256:createHash('sha256').update(updated).digest('hex'),
            records:result.length,changedRecords:1,unchangedOtherRecords:333,changedFields:changed,
            gapsBefore:gaps(entries),gapsAfter:gaps(result),refWritten:false}));
          NODE
