name: Original-source chronology gap probe (read-only)

on:
  pull_request:
    paths:
      - scripts/probe-palomar-zenodo-source-gaps.mjs
      - tests/probe-palomar-zenodo-source-gaps.test.mjs
      - .github/workflows/source-gap-evidence-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-gap-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Verify fixed source/version and no automatic clock promotion
        run: node --test tests/probe-palomar-zenodo-source-gaps.test.mjs
      - name: Inspect original fixed public version records
        run: node scripts/probe-palomar-zenodo-source-gaps.mjs evidence/source-gaps.json
      - name: Save candidate JSON and failure diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: original-source-gap-candidates
          path: evidence/source-gaps.json
          retention-days: 30
          if-no-files-found: warn
