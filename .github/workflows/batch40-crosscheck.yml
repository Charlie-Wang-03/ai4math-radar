name: Batch40 fixed second archive cross-check
on:
  push:
    branches: [audit/arxiv-clocked-batch40]
    paths: [.github/workflows/batch40-crosscheck.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read ten fixed rendered-feed snapshots and metadata tree
        run: |
          python3 - <<'PY'
          import json,re,hashlib,datetime,time
          from pathlib import Path
          from urllib.request import Request,build_opener,HTTPRedirectHandler
          PIN='9e971e4a9ec325fec5eadf178c36e2afe223b0b2'
          REPO='sifted-network/sifted-awesome-ai-agents'
          IDS=['2610.22339','2610.21881','2610.20681','2610.19864','2610.19470','2610.19223','2610.18301','2610.17331']
          class NoRedirect(HTTPRedirectHandler):
            def redirect_request(self,*args,**kwargs):return None
          opener=build_opener(NoRedirect());out=Path('evidence');out.mkdir()
          def get(url,limit=2000000):
            start=time.monotonic()
            with opener.open(Request(url,headers={'Accept':'application/json,text/plain','User-Agent':'AI4Math-Radar-audit'}),timeout=15) as r:
              data=r.read(limit+1)
              assert len(data)<=limit and time.monotonic()-start<20
              return data
          sources=[];matches=[]
          for day in range(12,17):
            for cat in ['ai','lg']:
              path=f'feed-entries/2026-10-{day:02d}/arxiv-cs-{cat}.md'
              url=f'https://raw.githubusercontent.com/{REPO}/{PIN}/{path}'
              rec={'path':path,'url':url,'matches':[]}
              try:
                data=get(url);text=data.decode('utf8');rec.update(bytes=len(data),sha256=hashlib.sha256(data).hexdigest(),gitBlob=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest())
                (out/f'{day}-{cat}.md').write_bytes(data)
                for section in re.split(r'(?m)^## ',text)[1:]:
                  for aid in IDS:
                    if f'(https://arxiv.org/abs/{aid})' not in section:continue
                    m={'arxivId':aid,'category':'cs.'+cat.upper(),'path':path,'sourceSha256':rec['sha256'],'entry':section.strip()}
                    matches.append(m);rec['matches'].append(aid)
              except Exception as e:rec['error']=type(e).__name__+': '+str(e)[:180]
              sources.append(rec)
          # Inspect names only; do not execute any third-party collector code.
          try:
            url=f'https://api.github.com/repos/{REPO}/git/trees/{PIN}?recursive=1'
            data=get(url,4000000);tree=json.loads(data)
            paths=[x['path'] for x in tree.get('tree',[]) if x['type']=='blob' and (x['path'].startswith(('scripts/','.github/workflows/','config/','src/')) or x['path'].startswith('data/') and '2026-10-1' in x['path'])]
            print('COLLECTOR_PATHS='+json.dumps(paths[:100]))
            (out/'collector-paths.json').write_text(json.dumps(paths,indent=2))
          except Exception as e:print('TREE_ERROR='+str(e))
          report={'checkedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'archiveCommit':PIN,'sources':sources,'matches':matches,'decision':'SECONDARY_RENDERED_SOURCE_FIELDS_REQUIRE_SEMANTIC_REVIEW'}
          (out/'crosscheck-report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          for m in matches:print('MATCH='+json.dumps(m,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: batch40-crosscheck
          path: evidence/
          retention-days: 30
          if-no-files-found: error
