name: Publication time evidence probe (read-only)

on:
  pull_request:
    paths:
      - scripts/probe-publication-evidence.mjs
      - tests/publication-evidence-probe.test.mjs
      - .github/workflows/publication-time-evidence-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Verify no-auto-promotion guard
        run: node --test tests/publication-evidence-probe.test.mjs
      - name: Inspect explicitly allowlisted publication sources
        run: node scripts/probe-publication-evidence.mjs evidence/time-candidates.json
      - name: Save research candidates for human evidence review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: publication-time-candidates
          path: evidence/time-candidates.json
          if-no-files-found: warn
          retention-days: 14
