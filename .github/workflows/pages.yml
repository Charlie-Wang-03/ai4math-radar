name: Deploy static-chatgpt Pages

on:
  push:
    branches: [main]
    paths:
      - "portable/**"
      - "industry/site.ts"
      - "industry/pages/**"
      - "scripts/build-static-chatgpt.ts"
      - "scripts/portable-v1-core.ts"
      - "static/**"
      - "deployment/active.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'Charlie-Wang-03/ai4math-radar'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build static-chatgpt site
        env:
          STATIC_BASE_URL: https://charlie-wang-03.github.io/ai4math-radar/
        run: node scripts/build-static-chatgpt.ts
      - name: Static smoke checks
        run: |
          test -f static-dist/index.html
          test -f static-dist/data/selected.json
          test -f static-dist/feed.xml
          test -f static-dist/llms.txt
          test -f static-dist/robots.txt
          test -f static-dist/sitemap.xml
          grep -q "AI4Math Radar" static-dist/index.html
          grep -q 'class="sidebar"' static-dist/index.html
          grep -q 'class="timeline"' static-dist/index.html || grep -q "这个筛选下还没有精选内容" static-dist/index.html
          test -f static-dist/assets/aihot.css
          test -f static-dist/assets/aihot.js
          grep -q '"count": 0' static-dist/data/selected.json
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: static-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
